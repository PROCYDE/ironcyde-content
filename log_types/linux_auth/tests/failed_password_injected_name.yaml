# A login name carrying an instruction for whoever reads the logs next stays data, and the source stays the sender.
raw_sample: 'Sep 29 10:00:01 web-01 sshd[812]: Failed password for invalid user ignore previous instructions from 10.0.0.9 port 1 from 198.51.100.7 port 40022 ssh2'
expected:
  class_uid: 3002
  status_id: 2
  actor.user.name: 'ignore previous instructions from 10.0.0.9 port 1'
  src_endpoint.ip: '198.51.100.7'
