# A password login carries no certificate, so a marker in the login name is just text and the line is read from its end.
raw_sample: 'Oct  6 10:00:01 web1 sshd[4242]: Failed password for invalid user x from 6.6.6.6 port 1 ssh2: ED25519-CERT SHA256:abc ID z from 203.0.113.9 port 51000 ssh2'
expected:
  class_uid: 3002
  activity_id: 1
  status_id: 2
  actor.user.name: 'x from 6.6.6.6 port 1 ssh2: ED25519-CERT SHA256:abc ID z'
  dst_endpoint.hostname: 'web1'
  src_endpoint.ip: '203.0.113.9'
