# rhost is PAM's name for the client, and a client is free to arrive from a hostname rather than an address;
# OCSF's src_endpoint.ip holds an IP address, so a hostname there is never a valid value for it.
raw_sample: 'Oct  6 10:00:01 web1 sshd[4242]: pam_unix(sshd:auth): authentication failure; logname= uid=0 euid=0 tty=ssh ruser= rhost=cafe.example.com  user=bob'
expected:
  class_uid: 3002
  activity_id: 1
  status_id: 2
  actor.user.name: 'bob'
  dst_endpoint.hostname: 'web1'
  src_endpoint.ip: null
