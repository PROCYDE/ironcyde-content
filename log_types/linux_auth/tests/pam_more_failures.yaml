# Current pam_unix writes the summary without the "PAM " prefix that older versions used.
raw_sample: 'Oct  6 10:00:01 web1 sshd[4242]: pam_unix(sshd:auth): 2 more authentication failures; logname= uid=0 euid=0 tty=ssh ruser= rhost=203.0.113.9  user=bob'
expected:
  class_uid: 3002
  activity_id: 1
  status_id: 2
  actor.user.name: 'bob'
  dst_endpoint.hostname: 'web1'
  src_endpoint.ip: '203.0.113.9'
