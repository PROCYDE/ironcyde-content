# PAM writes the client as rhost right after ruser; text in another field that reads like rhost is not the client.
raw_sample: 'Oct  6 10:00:01 web1 sshd[4242]: pam_unix(sshd:auth): authentication failure; logname= uid=0 euid=0 tty=ssh ruser=rhost=6.6.6.6 rhost=  user=bob'
expected:
  class_uid: 3002
  activity_id: 1
  status_id: 2
  actor.user.name: 'bob'
  dst_endpoint.hostname: 'web1'
  src_endpoint.ip: null
